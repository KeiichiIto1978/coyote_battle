name: Request Unity Personal License

on:
  workflow_dispatch:
  # PRブランチで旧方式を一度だけ検証する。検証後にpushトリガーは削除する。
  push:
    branches:
      - codex/issue-2-quality-gates
    paths:
      - .github/workflows/request-unity-personal-license.yml

permissions:
  contents: read

jobs:
  request-activation-file:
    name: Request activation file
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Request manual activation file
        id: activation
        uses: game-ci/unity-request-activation-file@65874ef791dae6dfa5829f1cb490eafbd7b2173c # v2 (deprecated)

      - name: Upload activation file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unity-activation-file
          path: ${{ steps.activation.outputs.filePath }}
          if-no-files-found: error
          retention-days: 1
